    function BoardView({ records, codes, tags, statuses, statusVisibility, layout, onEdit, onDelete, onOpenEquip, onMoveStatus, onReorderStatuses, onExpandStatus, getColor }) {
      const [dragCardId, setDragCardId] = useState(null);
      const [dragStatus, setDragStatus] = useState(null);
      const [overStatus, setOverStatus] = useState(null);
      const [hoveredData, setHoveredData] = useState(null);

      const visLevel = (s) => statusVisibility[s] || "visible";
      const fullStatuses = useMemo(
        () => statuses.filter(s => visLevel(s) === "visible"),
        [statuses, statusVisibility]
      );
      const collapsedStatuses = useMemo(
        () => statuses.filter(s => visLevel(s) === "collapsed"),
        [statuses, statusVisibility]
      );

      const byStatus = useMemo(() => {
        const map = {};
        for (const s of statuses) map[s] = [];
        const unassigned = [];
        for (const r of records) {
          if (r.status && map[r.status]) map[r.status].push(r);
          else unassigned.push(r);
        }
        return { map, unassigned };
      }, [records, statuses]);

      const onCardDragStart = (e, recordId) => {
        setHoveredData(null);
        setDragCardId(recordId);
        e.dataTransfer.setData("text/plain", recordId);
        e.dataTransfer.effectAllowed = "move";
      };
      const onColumnDrop = (e, status) => {
        e.preventDefault();
        if (dragCardId) {
          onMoveStatus(dragCardId, status);
          setDragCardId(null);
        }
      };

      const onColHeaderDrop = (targetStatus) => {
        if (dragStatus !== null && dragStatus !== targetStatus) {
          onReorderStatuses(statuses.indexOf(dragStatus), statuses.indexOf(targetStatus));
        }
        setDragStatus(null);
        setOverStatus(null);
      };

      const handleMouseEnter = (e, record) => {
        if (dragCardId) return;
        const rect = e.currentTarget.getBoundingClientRect();
        setHoveredData({ record, rect });
      };

      const handleMouseLeave = () => {
        setHoveredData(null);
      };

      const scrollStyle = layout === "grid"
        ? { ...styles.boardScroll, flexWrap: "wrap", overflowX: "visible" }
        : styles.boardScroll;

      return (
        <div style={styles.boardOuterRow} onMouseLeave={handleMouseLeave}>
          <div style={styles.boardWrap}>
            <div style={scrollStyle}>
              {fullStatuses.map((status) => (
                <div
                  key={status}
                  style={{ ...styles.boardCol, ...(overStatus === status ? styles.boardColDragOver : {}) }}
                  onDragOver={(e) => { e.preventDefault(); if (dragStatus !== null) setOverStatus(status); }}
                  onDragLeave={() => setOverStatus(o => (o === status ? null : o))}
                  onDrop={(e) => { if (dragStatus !== null) onColHeaderDrop(status); else onColumnDrop(e, status); setOverStatus(null); }}
                >
                  <div
                    style={styles.boardColHead}
                    draggable
                    onDragStart={() => setDragStatus(status)}
                    onDragEnd={() => { setDragStatus(null); setOverStatus(null); }}
                    title="ドラッグして列を並び替え"
                  >
                    <GripVertical size={13} color="#6b6658" />
                    <span style={styles.boardColTitle}>{status}</span>
                    <span style={styles.boardColCount}>{byStatus.map[status]?.length || 0}</span>
                  </div>
                  <div style={styles.boardColBody}>
                    {(byStatus.map[status] || []).map(r => (
                      <div key={r.id} className="board-card-container">
                        <div
                          style={{ ...styles.boardCard, ...(dragCardId === r.id ? styles.boardCardDragging : {}) }}
                          draggable
                          onDragStart={(e) => onCardDragStart(e, r.id)}
                          onDragEnd={() => setDragCardId(null)}
                          onMouseEnter={(e) => handleMouseEnter(e, r)}
                          onClick={() => onEdit(r)}
                        >
                          <div style={styles.boardCardTitle}>{r.subject || "（無題）"}</div>
                          {r.kind && <span style={{ ...styles.pill, background: getColor(r.kind, 0), fontSize: 10, padding: "1px 5px", marginBottom: 4 }}>{r.kind}</span>}
                          {r.content ? (
                            <div style={styles.boardCardContent}>{r.content}</div>
                          ) : (
                            <div style={{ fontSize: 11, color: "#605a49" }}>内容未記入</div>
                          )}
                        </div>

                        {hoveredData && hoveredData.record.id === r.id && (
                          <BoardCardFloatingDetail
                            record={hoveredData.record}
                            anchorRect={hoveredData.rect}
                            onEdit={onEdit}
                            onDelete={onDelete}
                            onOpenEquip={onOpenEquip}
                            onClose={() => setHoveredData(null)}
                          />
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>

            {byStatus.unassigned.length > 0 && (
              <div style={styles.boardUnassigned}>
                <div style={styles.boardColTitle}>ステータス未設定 ({byStatus.unassigned.length}件)</div>
                <div style={styles.boardUnassignedList}>
                  {byStatus.unassigned.map(r => (
                    <div key={r.id} style={styles.boardCard} onClick={() => onEdit(r)} onMouseEnter={(e) => handleMouseEnter(e, r)}>
                      <div style={styles.boardCardTitle}>{r.subject || "（無題）"}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>

          {collapsedStatuses.length > 0 && (
            <div style={styles.boardCollapsedPanel}>
              <div style={styles.boardCollapsedTitle}>簡易表示中</div>
              {collapsedStatuses.map((status) => (
                <div
                  key={status}
                  style={styles.boardCollapsedRow}
                  onClick={() => onExpandStatus(status)}
                  title="クリックで通常表示に戻す"
                >
                  <span style={{ ...styles.boardCollapsedDot, background: getColor(status, statuses.indexOf(status)) }} />
                  <span style={styles.boardCollapsedName}>{status}</span>
                  <span style={styles.boardColCount}>{byStatus.map[status]?.length || 0}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ================= Status Admin =================
    function StatusAdmin({ statusesKousei, statusesShuuri, hiddenStatuses, onAdd, onRename, onRemove, onReorder, onToggleHidden, onClose }) {
      const [activeTab, setActiveTab] = useState("校正");
      const [newStatus, setNewStatus] = useState("");
      const [editingIdx, setEditingIdx] = useState(null);
      const [editingText, setEditingText] = useState("");
      const [dragIdx, setDragIdx] = useState(null);

      const currentStatuses = activeTab === "校正" ? statusesKousei : statusesShuuri;

      const startEdit = (idx) => { setEditingIdx(idx); setEditingText(currentStatuses[idx]); };
      const commitEdit = () => {
        if (editingIdx !== null) onRename(activeTab, currentStatuses[editingIdx], editingText);
        setEditingIdx(null);
      };

      const VIS_OPTIONS = [
        { level: "visible", icon: Eye, label: "表示" },
        { level: "collapsed", icon: Minus, label: "簡易" },
        { level: "hidden", icon: EyeOff, label: "非表示" },
      ];

      return (
        <div style={styles.overlay} onClick={onClose}>
          <div style={styles.modal} onClick={e => e.stopPropagation()}>
            <div style={styles.modalHead}>
              <div style={styles.modalTitle}>ステータス列を編集</div>
              <button style={styles.iconBtn} onClick={onClose}><X size={16} /></button>
            </div>

            <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
              <button
                style={{ ...styles.viewBtn, ...(activeTab === "校正" ? styles.viewBtnActive : {}) }}
                onClick={() => { setActiveTab("校正"); setEditingIdx(null); }}
              >校正ルート</button>
              <button
                style={{ ...styles.viewBtn, ...(activeTab === "修理・不具合対応" ? styles.viewBtnActive : {}) }}
                onClick={() => { setActiveTab("修理・不具合対応"); setEditingIdx(null); }}
              >修理ルート</button>
            </div>

            <div style={styles.statusAdminHint}>ドラッグして並び替え、クリックで名前を編集</div>
            <div style={styles.tagAdminList}>
              {currentStatuses.map((s, idx) => {
                const level = hiddenStatuses[s] || "visible";
                return (
                  <div
                    key={s}
                    style={{
                      ...styles.statusAdminRow,
                      ...(dragIdx === idx ? styles.statusAdminRowDragging : {}),
                      ...(level !== "visible" ? styles.statusAdminRowHidden : {}),
                    }}
                    draggable
                    onDragStart={() => setDragIdx(idx)}
                    onDragOver={(e) => e.preventDefault()}
                    onDrop={() => { if (dragIdx !== null && dragIdx !== idx) onReorder(activeTab, dragIdx, idx); setDragIdx(null); }}
                    onDragEnd={() => setDragIdx(null)}
                  >
                    <GripVertical size={14} color="#6b6658" />
                    {editingIdx === idx ? (
                      <input
                        style={{ ...styles.input, flex: 1 }}
                        value={editingText}
                        autoFocus
                        onChange={e => setEditingText(e.target.value)}
                        onBlur={commitEdit}
                        onKeyDown={e => { if (e.key === "Enter") commitEdit(); if (e.key === "Escape") setEditingIdx(null); }}
                      />
                    ) : (
                      <span style={styles.statusAdminName} onClick={() => startEdit(idx)}>{s}</span>
                    )}
                    <div style={styles.statusVisGroup}>
                      {VIS_OPTIONS.map(opt => (
                        <button
                          key={opt.level}
                          style={{ ...styles.statusVisBtn, ...(level === opt.level ? styles.statusVisBtnActive : {}) }}
                          onClick={() => onToggleHidden(s, opt.level)}
                          title={opt.label}
                        >
                          <opt.icon size={13} />
                        </button>
                      ))}
                    </div>
                    <button style={styles.iconBtn} onClick={() => onRemove(activeTab, s)}><Trash2 size={14} /></button>
                  </div>
                );
              })}
            </div>
            <div style={styles.fieldRow}>
              <input
                style={styles.input}
                placeholder="新しいステータス名"
                value={newStatus}
                onChange={e => setNewStatus(e.target.value)}
                onKeyDown={e => { if (e.key === "Enter" && newStatus.trim()) { onAdd(activeTab, newStatus); setNewStatus(""); } }}
              />
              <button style={styles.primaryBtn} onClick={() => { if (newStatus.trim()) { onAdd(activeTab, newStatus); setNewStatus(""); } }}>
                <Plus size={15} /> 追加
              </button>
            </div>
          </div>
        </div>
      );
    }

      const [honkouseiDate, setHonkouseiDate] = useState(toISODate(initial?.honkouseiDate) || "");
      const [honkouseiTime, setHonkouseiTime] = useState(initial?.honkouseiTime || "");

        setKind(nextKind);
        const nextStatuses = getStatusesForKind(nextKind);
        if (!nextStatuses.includes(status)) {
          setStatus(nextStatuses[0] || "");
        }
      };

      const matches = useMemo(() => {
        if (!codeQuery.trim()) return [];
        const q = codeQuery.trim().toLowerCase();
        return codes
          .filter(c => {
            const dealer = dealerFor(c.code);
            return (
              c.name.toLowerCase().includes(q) ||
              c.code.toLowerCase().includes(q) ||
              (dealer && (
                dealer.abbr.toLowerCase().includes(q) ||
                dealer.name.includes(q) ||
                (dealer.customerName && dealer.customerName.includes(q))
              ))
            );
          })
          .slice(0, 8);
      }, [codeQuery, codes]);

      const pickCode = (c) => {
        setSubject(displayNameFor(c.name, c.code));
        setCode(c.code);
        
        const dealer = dealerFor(c.code);
        if (dealer && dealer.customerName) {
          setCustomer(dealer.customerName);
        }

        if (c.code) {
          copyToClipboard(c.code);
        }

        setCodeQuery("");
        setShowSuggest(false);
      };

      const buildRecordPayload = () => ({
        id: initial?.id,
        subject: subject.trim(),
        kind,
        code,
        customer,
        contactName,
        personInCharge,
        model,
        serialYear,
        content,
        status,
        tag,
        note,
        receivedDate: toISODate(receivedDate),
        receivedTime,
        visitDate: toISODate(visitDate),

        workDate: toISODate(workDate),
        workTime,
        precheckDate: toISODate(precheckDate),
        precheckTime,
        honkouseiDate: toISODate(honkouseiDate),
        honkouseiTime,

        if (!subject.trim()) {
          alert("件名（拠点名）を入力してください");
          return;
        }
        onSave(buildRecordPayload());
      };

    // ================= Date Picker Only =================
    function DatePicker({ value, onChange }) {
      const [open, setOpen] = useState(false);
      const [cursor, setCursor] = useState(() => {
        const base = value ? new Date(value + "T00:00:00") : new Date();
        return { y: base.getFullYear(), m: base.getMonth() };
      });
      const cells = useMemo(() => monthMatrix(cursor.y, cursor.m), [cursor]);

      const move = (delta) => {
        let nm = cursor.m + delta, ny = cursor.y;
        if (nm < 0) { nm = 11; ny -= 1; }
        if (nm > 11) { nm = 0; ny += 1; }
        setCursor({ y: ny, m: nm });
      };

      const pick = (date) => {
        onChange(toISODate(date));
        setOpen(false);
      };

      useEffect(() => {
        if (!open) return;
        const onKey = (e) => { if (e.key === "Escape") { e.stopPropagation(); setOpen(false); } };
        window.addEventListener("keydown", onKey, true);
        return () => window.removeEventListener("keydown", onKey, true);
      }, [open]);

      const todayIso = toISODate(new Date());

      return (
        <div style={{ position: "relative", display: "inline-block" }}>
          <button type="button" style={styles.dtDateBtnNotion} onClick={() => setOpen(o => !o)}>
            <CalendarIcon size={12} /> {value ? fmtJP(value) : "未入力"}
          </button>

          {open && (
            <React.Fragment>
              <div style={styles.dtBackdrop} onClick={() => setOpen(false)} />
              <div style={styles.dtPopup} onClick={e => e.stopPropagation()}>
                <div style={styles.calNav}>
                  <button type="button" style={styles.iconBtn} onClick={() => move(-1)}><ChevronLeft size={14} /></button>
                  <div style={styles.calMonthLabel}>{cursor.y}年 {cursor.m + 1}月</div>
                  <button type="button" style={styles.iconBtn} onClick={() => move(1)}><ChevronRight size={14} /></button>
                </div>
                <div style={styles.dtGrid}>
                  {["日", "月", "火", "水", "木", "金", "土"].map(d => (
                    <div key={d} style={styles.dtDow}>{d}</div>
                  ))}
                  {cells.map((date, i) => {
                    if (!date) return <div key={i} style={styles.dtCellEmpty} />;
                    const iso = toISODate(date);
                    const selected = iso === value;
                    const isToday = iso === todayIso;
                    return (
                      <div
                        key={i}
                        style={{ ...styles.dtCell, ...(isToday ? styles.dtCellToday : {}), ...(selected ? styles.dtCellSelected : {}) }}
                        onClick={() => pick(date)}
                      >
                        {date.getDate()}
                      </div>
                    );
                  })}
                </div>
                <button type="button" style={styles.dtTodayBtn} onClick={() => pick(new Date())}>今日</button>
              </div>
            </React.Fragment>
          )}
        </div>
      );
    }

        return { y: base.getFullYear(), m: base.getMonth() };
      });
      const cells = useMemo(() => monthMatrix(cursor.y, cursor.m), [cursor]);

      const move = (delta) => {
        let nm = cursor.m + delta, ny = cursor.y;
        if (nm < 0) { nm = 11; ny -= 1; }
        if (nm > 11) { nm = 0; ny += 1; }
        setCursor({ y: ny, m: nm });
      };

      const pick = (date) => {
        onDateChange(toISODate(date));
        setOpen(false);
      };

      useEffect(() => {
        if (!open) return;
        const onKey = (e) => {

        window.addEventListener("keydown", onKey, true);

        </div>
      );

    // ================= Import Modal =================
    function ImportModal({ existing, onClose, onImport }) {
      const [text, setText] = useState("");
      const [fileName, setFileName] = useState("");
      const [dragOver, setDragOver] = useState(false);
      const [error, setError] = useState("");
      const fileInputRef = useRef(null);
      const preview = useMemo(() => parseCsv(text), [text]);

      const readFile = (file) => {
        if (!file) return;
        setError("");
        if (!/\.(csv|tsv|txt)$/i.test(file.name)) {
          setError("CSV / TSV / TXT形式のファイルを選択してください");
          return;
        }
        const reader = new FileReader();
        reader.onload = (e) => {
          const content = String(e.target.result).replace(/^\uFEFF/, "");
          setText(content);
          setFileName(file.name);
        };
        reader.onerror = () => setError("ファイルの読み込みに失敗しました");
        reader.readAsText(file, "UTF-8");
      };

      const onDrop = (e) => {
        e.preventDefault();
        setDragOver(false);
        const file = e.dataTransfer.files?.[0];
        readFile(file);
      };

      return (
        <div style={styles.overlay} onClick={onClose}>
          <div style={styles.modal} onClick={e => e.stopPropagation()}>
            <div style={styles.modalHead}>
              <div style={styles.modalTitle}>顧客コード表を取込</div>
              <button style={styles.iconBtn} onClick={onClose}><X size={16} /></button>
            </div>

            <div
              style={{ ...styles.dropZone, ...(dragOver ? styles.dropZoneActive : {}) }}
              onClick={() => fileInputRef.current?.click()}
              onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
              onDragLeave={() => setDragOver(false)}
              onDrop={onDrop}
            >
              <input
                ref={fileInputRef}
                type="file"
                accept=".csv,.tsv,.txt,text/csv"
                style={{ display: "none" }}
                onChange={(e) => readFile(e.target.files?.[0])}
              />
              <FileText size={22} color="#9d9788" />
              <div style={styles.dropZoneText}>
                {fileName ? `${fileName}（追加でもう1ファイル選択できます）` : "CSVファイルをドラッグ&ドロップ、またはクリックして選択"}
              </div>
            </div>

            {error && <div style={styles.importError}>{error}</div>}

            <div style={styles.orDivider}>または直接貼り付け</div>

            <div style={styles.field}>
              <label style={styles.label}>Notionの表からコピー&ペースト(店舗名,コード の順、タブ・カンマ区切り両対応)</label>
              <textarea
                style={{ ...styles.input, minHeight: 130, fontFamily: "'IBM Plex Mono', monospace", fontSize: 12.5 }}
                value={text}
                placeholder={"御殿場萩原店\t3101BI\n函南店\t3101CN\n西条店\t3101DA"}
                onChange={e => { setText(e.target.value); setFileName(""); }}
              />
            </div>
            {preview.length > 0 && (
              <div style={styles.importPreview}>
                {preview.length}件を検出（現在の{existing.length}件に追加・更新されます）
                <div style={styles.importPreviewList}>
                  {preview.slice(0, 5).map(c => {
                    const dealer = dealerFor(c.code);
                    return (
                      <div key={c.id} style={styles.importPreviewRow}>
                        {dealer ? `${dealer.abbr}${c.name}` : c.name}
                        <span style={styles.suggestCode}> {c.code}</span>
                        {!dealer && <span style={styles.importWarn}> ・拠点コード未認識</span>}
                      </div>
                    );
                  })}
                  {preview.length > 5 && <div style={styles.importPreviewRow}>…他{preview.length - 5}件</div>}
                </div>
              </div>
            )}
            <div style={styles.modalActions}>
              <button style={styles.ghostBtn} onClick={onClose}>キャンセル</button>
              <button
                style={{ ...styles.primaryBtn, opacity: preview.length ? 1 : 0.5 }}
                disabled={!preview.length}
                onClick={() => onImport(preview)}
              >
                <Upload size={15} /> {preview.length}件を追加
              </button>
            </div>
          </div>
        </div>
      );
    }

    function blankInstance(def) {
      const meta = {};
      for (const mb of def.metaBlocks) meta[mb.key] = { model: "", serial: "", year: "", typeClass: "" };
      const extra = {};
      for (const ef of (def.extraMetaFields || [])) extra[ef.key] = "";
      const checks = {}, subValues = {}, grids = {}, inline = {}, consumChecks = {};
      for (const sec of def.sections) {
        if (sec.type === "checklist") {
          for (const item of sec.items) {
            checks[`${sec.key}.${item.key}`] = false;
            if (item.selector) subValues[`${sec.key}.${item.key}.${item.selector.key}`] = "";
            if (item.unitSelector) subValues[`${sec.key}.${item.key}.${item.unitSelector.key}`] = item.unitSelector.default || "";
            if (item.subFields) for (const sf of item.subFields) subValues[`${sec.key}.${item.key}.${sf.key}`] = "";
          }
        } else if (sec.type === "grid") {
          grids[sec.key] = {};
          for (const row of sec.rows) {
            for (const col of sec.cols) {
              grids[sec.key][`${row.key}.${col.key}`] = "";
              if (row.selector) {
                grids[sec.key][`${row.key}.${col.key}.dir`] = "";
              }
            }
          }
        } else if (sec.type === "inline") {
          for (const f of sec.fields) inline[`${sec.key}.${f.key}`] = f.defaultValue || "";
        } else if (sec.type === "consumables") {
          for (const item of sec.items) consumChecks[item] = false;
        }
      }
      return { meta, extra, checks, subValues, grids, inline, consumChecks, disabled: false, note: "" };
    }

    function mergeWithSchema(def, existingInst) {
      const blank = blankInstance(def);
      if (!existingInst) return blank;
      const meta = {};
      for (const mb of def.metaBlocks) {
        meta[mb.key] = {
          model: existingInst.meta?.[mb.key]?.model || "",
          serial: existingInst.meta?.[mb.key]?.serial || "",
          year: existingInst.meta?.[mb.key]?.year || "",
          typeClass: existingInst.meta?.[mb.key]?.typeClass || ""
        };
      }
      return {
        meta,
        extra: { ...blank.extra, ...(existingInst.extra || {}) },
        checks: { ...blank.checks, ...(existingInst.checks || {}) },
        subValues: { ...blank.subValues, ...(existingInst.subValues || {}) },
        grids: {
          ...blank.grids,
          ...Object.fromEntries(
            Object.keys(blank.grids).map(gk => [gk, { ...(blank.grids[gk] || {}), ...(existingInst.grids?.[gk] || {}) }])
          )
        },
        inline: { ...blank.inline, ...(existingInst.inline || {}) },
        consumChecks: { ...blank.consumChecks, ...(existingInst.consumChecks || {}) },
        disabled: !!existingInst.disabled,
        note: existingInst.note || ""
      };
    }

    function carryOverInstance(def, prevInstance) {
      const blank = blankInstance(def);
      if (!prevInstance) return blank;
      const meta = {};
      for (const mb of def.metaBlocks) {
        meta[mb.key] = {
          model: prevInstance.meta?.[mb.key]?.model || "",
          serial: prevInstance.meta?.[mb.key]?.serial || "",
          year: prevInstance.meta?.[mb.key]?.year || "",
          typeClass: prevInstance.meta?.[mb.key]?.typeClass || ""
        };
      }
      return { ...blank, meta, disabled: !!prevInstance.disabled, note: prevInstance.note || "" };
    }

    function buildEquipment(carrySource) {
      const base = {};
      for (const def of EQUIPMENT_DEFS) base[def.key] = carryOverInstance(def, carrySource?.[def.key]);
      return base;
    }

    function migrateEquipmentMap(equipmentMap) {
      const base = {};
      for (const def of EQUIPMENT_DEFS) base[def.key] = mergeWithSchema(def, equipmentMap?.[def.key]);
      return base;
    }

    function EquipmentSheet({ record, onClose, onSave }) {
      const defaultInspectionDate = toISODate(record.precheckDate) || toISODate(new Date());

      const initialSheets = useMemo(() => {
        if (record.equipmentSheets?.length) {
          return record.equipmentSheets.map(s => ({
            ...s,
            equipment: migrateEquipmentMap(s.equipment)
          }));
        }
        if (record.equipment) {
          return [{ id: uid(), inspectedOn: defaultInspectionDate, equipment: migrateEquipmentMap(record.equipment) }];
        }
        return [];
      }, [record, defaultInspectionDate]);

      const [sheets, setSheets] = useState(initialSheets);
      const latest = useMemo(() => {
        return [...sheets].sort((a, b) => (b.inspectedOn || "").localeCompare(a.inspectedOn || ""))[0];
      }, [sheets]);

      const [selectedId, setSelectedId] = useState(latest?.id ?? null);
      const [isNew, setIsNew] = useState(!latest);
      const [inspectedOn, setInspectedOn] = useState(latest?.inspectedOn || defaultInspectionDate);
      const [equipment, setEquipment] = useState(() => latest?.equipment ? migrateEquipmentMap(latest.equipment) : buildEquipment(null));

      const selectSheet = (sheet) => {
        setSelectedId(sheet.id);
        setIsNew(false);
        setInspectedOn(sheet.inspectedOn || defaultInspectionDate);
        setEquipment(migrateEquipmentMap(sheet.equipment));
      };

      const startNew = () => {
        setSelectedId(null);
        setIsNew(true);
        setInspectedOn(defaultInspectionDate);
        setEquipment(buildEquipment(latest?.equipment));
      };

      const removeSheet = (id) => {
        if (!window.confirm("この点検票を削除しますか？")) return;
        const next = sheets.filter(s => s.id !== id);
        setSheets(next);
        if (selectedId === id) {
          const nextLatest = [...next].sort((a, b) => (b.inspectedOn || "").localeCompare(a.inspectedOn || ""))[0];
          if (nextLatest) selectSheet(nextLatest); else startNew();
        }
      };

      const updateInstance = (key, mutator) => {
        setEquipment(prev => {
          const currentInst = prev[key] || blankInstance(EQUIPMENT_DEFS.find(d => d.key === key));
          return { ...prev, [key]: mutator(currentInst) };
        });
      };

      const submit = () => {
        let next;
        if (isNew) {
          next = [{ id: uid(), inspectedOn, equipment }, ...sheets];
        } else {
          next = sheets.map(s => s.id === selectedId ? { ...s, inspectedOn, equipment } : s);
        }
        onSave(next);
      };

      const sortedSheets = useMemo(
        () => [...sheets].sort((a, b) => (b.inspectedOn || "").localeCompare(a.inspectedOn || "")),
        [sheets]
      );

      return (
        <div style={styles.overlay} onClick={onClose}>
          <div
            style={styles.equipModal}
            onClick={e => e.stopPropagation()}
            onKeyDown={e => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); submit(); } }}
          >
            <div style={styles.modalHead}>
              <div>
                <div style={styles.modalTitle}>機器点検票</div>
                <div style={styles.equipSubtitle}>{record.subject || "（無題）"}</div>
              </div>
              <button style={styles.iconBtn} onClick={onClose}><X size={16} /></button>
            </div>

            <div style={styles.equipHistoryRow}>
              {sortedSheets.map(s => (
                <div
                  key={s.id}
                  style={{ ...styles.equipHistoryChip, ...((!isNew && selectedId === s.id) ? styles.equipHistoryChipActive : {}) }}
                  onClick={() => selectSheet(s)}
                >
                  <span>{s.inspectedOn ? fmtJP(s.inspectedOn) : "(日付未設定)"}</span>
                  <button
                    style={styles.equipHistoryDelete}
                    onClick={(e) => { e.stopPropagation(); removeSheet(s.id); }}
                    title="この年の点検票を削除"
                  >
                    <X size={11} />
                  </button>
                </div>
              ))}
              <button style={{ ...styles.equipHistoryChip, ...(isNew ? styles.equipHistoryChipActive : {}) }} onClick={startNew}>
                <Plus size={12} /> 新規作成
              </button>
            </div>

            <div style={styles.field}>
              <label style={styles.label}>点検実施日</label>
              <DatePicker value={inspectedOn} onChange={setInspectedOn} />
              {isNew && <div style={styles.equipCarryNote}>型式・製造番号・年式・類別・備考は前回の点検票から引き継いでいます</div>}
            </div>

            <div style={styles.equipGrid}>
              {EQUIPMENT_DEFS.map(def => (
                <EquipmentCard
                  key={def.key}
                  def={def}
                  data={equipment[def.key] || blankInstance(def)}
                  onChange={(mutator) => updateInstance(def.key, mutator)}
                />
              ))}
            </div>

            <div style={styles.modalActions}>
              <button style={styles.ghostBtn} onClick={onClose}>キャンセル</button>
              <button style={styles.primaryBtn} onClick={submit}><Save size={15} /> {isNew ? "新しい点検票として保存" : "上書き保存"}</button>
            </div>
          </div>
        </div>
      );
    }

    function EquipmentCard({ def, data, onChange }) {
      const isDisabled = !!data.disabled;

      const toggleDisabled = () => {
        onChange(inst => ({ ...inst, disabled: !inst.disabled }));
      };

      const setMeta = (blockKey, field, value) => {
        onChange(inst => ({
          ...inst,
          meta: {
            ...inst.meta,
            [blockKey]: {
              ...(inst.meta?.[blockKey] || {}),
              [field]: field === "model" ? value : toHalfWidth(value)
            }
          }
        }));
      };

      const setExtra = (fieldKey, value) =>
        onChange(inst => ({ ...inst, extra: { ...(inst.extra || {}), [fieldKey]: toHalfWidth(value) } }));

      const toggleCheck = (sectionKey, itemKey) =>
        onChange(inst => ({
          ...inst,
          checks: { ...(inst.checks || {}), [`${sectionKey}.${itemKey}`]: !inst.checks?.[`${sectionKey}.${itemKey}`] }
        }));

      const setSubValue = (sectionKey, itemKey, subKey, value) =>
        onChange(inst => ({
          ...inst,
          subValues: { ...(inst.subValues || {}), [`${sectionKey}.${itemKey}.${subKey}`]: toHalfWidth(value) }
        }));

      const setGridValue = (sectionKey, rowKey, colKey, value) =>
        onChange(inst => ({
          ...inst,
          grids: {
            ...(inst.grids || {}),
            [sectionKey]: {
              ...(inst.grids?.[sectionKey] || {}),
              [`${rowKey}.${colKey}`]: toHalfWidth(value)
            }
          }
        }));

      const setGridSelectorValue = (sectionKey, rowKey, colKey, value) =>
        onChange(inst => ({
          ...inst,
          grids: {
            ...(inst.grids || {}),
            [sectionKey]: {
              ...(inst.grids?.[sectionKey] || {}),
              [`${rowKey}.${colKey}.dir`]: value
            }
          }
        }));

      const setInlineValue = (sectionKey, fieldKey, value) =>
        onChange(inst => ({
          ...inst,
          inline: { ...(inst.inline || {}), [`${sectionKey}.${fieldKey}`]: toHalfWidth(value) }
        }));

      const toggleConsum = (item) =>
        onChange(inst => ({
          ...inst,
          consumChecks: { ...(inst.consumChecks || {}), [item]: !inst.consumChecks?.[item] }
        }));

      const setNote = (value) => onChange(inst => ({ ...inst, note: value }));

      return (
        <div style={{ ...styles.equipCard, ...(isDisabled ? styles.equipCardDisabled : {}) }}>
          <div
            style={styles.equipCardTitleRow}
            onClick={toggleDisabled}
            title="クリックで対象外/使用中を切り替え"
          >
            <span style={{ ...styles.equipCardTitle, ...(isDisabled ? styles.equipCardTitleDimmed : {}) }}>
              {def.label}
            </span>
            <span style={{ ...styles.statusBadge, ...(isDisabled ? styles.statusBadgeOff : styles.statusBadgeOn) }}>
              {isDisabled ? "対象外 (未使用)" : "使用中"}
            </span>
          </div>

          <div style={{ opacity: isDisabled ? 0.35 : 1, pointerEvents: isDisabled ? "none" : "auto", transition: "opacity 0.2s" }}>
            {def.metaBlocks.map(mb => (
              <div key={mb.key} style={styles.equipMetaBlock}>
                {mb.title && (
                  <div style={styles.equipMetaBlockTitle}>
                    {mb.title}{mb.note && <span style={styles.equipInlineNote}> {mb.note}</span>}
                  </div>
                )}
                <div style={styles.equipMetaRow}>
                  <input
                    disabled={isDisabled}
                    style={styles.equipMetaInput}
                    placeholder="型式"
                    value={data.meta?.[mb.key]?.model || ""}
                    onChange={e => setMeta(mb.key, "model", e.target.value)}
                  />
                  <input
                    disabled={isDisabled}
                    style={styles.equipMetaInput}
                    placeholder="製造番号"
                    value={data.meta?.[mb.key]?.serial || ""}
                    onChange={e => setMeta(mb.key, "serial", e.target.value)}
                  />
                  <input
                    disabled={isDisabled}
                    style={styles.equipMetaInput}
                    placeholder="年式"
                    value={data.meta?.[mb.key]?.year || ""}
                    onChange={e => setMeta(mb.key, "year", e.target.value)}
                  />
                  <input
                    disabled={isDisabled}
                    style={styles.equipMetaInput}
                    placeholder="類別"
                    value={data.meta?.[mb.key]?.typeClass || ""}
                    onChange={e => setMeta(mb.key, "typeClass", e.target.value)}
                  />
                </div>
              </div>
            ))}

            {def.extraMetaFields?.map(ef => (
              <input
                key={ef.key}
                disabled={isDisabled}
                style={{ ...styles.equipMetaInput, width: "100%", marginBottom: 8 }}
                placeholder={ef.label}
                value={data.extra?.[ef.key] || ""}
                onChange={e => setExtra(ef.key, e.target.value)}
              />
            ))}

            {def.sections.map(sec => {
              if (sec.type === "checklist") {
                return (
                  <div key={sec.key} style={styles.equipCheckList}>
                    {sec.items.map(item => (
                      <div key={item.key}>
                        <label style={styles.equipCheckRow}>
                          <input
                            disabled={isDisabled}
                            type="checkbox"
                            checked={!!data.checks?.[`${sec.key}.${item.key}`]}
                            onChange={() => toggleCheck(sec.key, item.key)}
                          />
                          <span>{item.label}</span>
                          {item.note && <span style={styles.equipInlineNote}> {item.note}</span>}
                        </label>
                        {(item.selector || item.unitSelector || item.subFields) && (
                          <div style={styles.equipSubFieldsRow}>

                                  style={styles.equipSubInput}
                                  inputMode="decimal"
                                  value={data.subValues?.[`${sec.key}.${item.key}.${sf.key}`] || ""}
                                  onChange={e => setSubValue(sec.key, item.key, sf.key, e.target.value)}
                                />

                              </span>
                            ))}
                            {item.unitSelector && (
                              <span style={styles.equipSelectorGroup}>
                                {item.unitSelector.options.map(opt => (
                                  <label key={opt} style={styles.equipRadioLabel}>
                                    <input
                                      disabled={isDisabled}
                                      type="radio"
