    // ---------- storage helpers ----------
    const REC_KEY = "kousei:records";

    const DEFAULT_COLUMN_ORDER = [
      "subject", "kind", "customer", "contactName", "personInCharge", "model", "serialYear", "content",

      subject: 220, kind: 100, customer: 140, contactName: 100, personInCharge: 100, model: 120, serialYear: 140, content: 240,

    const uid = () => `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 9)}`;

    const CATEGORY_PALETTE = [

    const DEFAULT_STATUSES_KOUSEI = [

    const DEALER_PREFIX = {
      "3101": { name: "静岡日産", abbr: "SN", customerName: "静岡N" },
      "3106": { name: "プリンス静岡", abbr: "PS", customerName: "P静岡" },

    const dealerFor = (code) => {
      if (!code) return null;
      const prefix = code.slice(0, 4);

    };
    const displayNameFor = (name, code) => {
      const dealer = dealerFor(code);

    const copyToClipboard = (text) => {
      if (!text) return;
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text);
      } else {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        try { document.execCommand("copy"); } catch (e) {}
        document.body.removeChild(textarea);
      }
    };

    // 未保存の書き込みをキー単位で保持し、離脱時に確実にフラッシュするためのレジストリ
    const __pendingWrites = new Map(); // key -> { next, timer }
    const __flushWrite = async (key) => {
      const pending = __pendingWrites.get(key);
      if (!pending) return;
      __pendingWrites.delete(key);
      if (pending.timer) clearTimeout(pending.timer);
      try {
        if (window.storage && typeof window.storage.set === "function") {
          await window.storage.set(key, JSON.stringify(pending.next), false);
        } else {
          localStorage.setItem(key, JSON.stringify(pending.next));
        }
      } catch (e) {
        console.error("Storage save failed", key, e);
      }
    };
    const __flushAllWrites = () => { __pendingWrites.forEach((_, key) => __flushWrite(key)); };
    if (typeof window !== "undefined" && !window.__ledgerFlushBound) {
      window.__ledgerFlushBound = true;
      window.addEventListener("beforeunload", __flushAllWrites);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") __flushAllWrites();
      });
    }

    const STORAGE_DEBOUNCE_MS = 500;

    function useStorageState(key, initial) {
      const [value, setValue] = useState(initial);
      const [loaded, setLoaded] = useState(false);

      useEffect(() => {
        let cancelled = false;
        (async () => {
          try {
            if (window.storage && typeof window.storage.get === "function") {
              const res = await window.storage.get(key, false);
              if (!cancelled && res) setValue(JSON.parse(res.value));
            } else {
              const raw = localStorage.getItem(key);
              if (!cancelled && raw) setValue(JSON.parse(raw));
            }
          } catch (e) {
            // 未保存キーへの初回アクセスは正常な状態(既定値を使用)
          } finally {
            if (!cancelled) setLoaded(true);
          }
        })();
        return () => { cancelled = true; };
      }, [key]);

      // 画面表示は即時反映し、実際のストレージ書き込みは500ms分まとめて実行する
      // (セルを1文字編集するたびに台帳全体をシリアライズ・保存する負荷とAPIレート制限抵触を回避)
      const persist = useCallback((next) => {
        setValue(next);
        const existing = __pendingWrites.get(key);
        if (existing && existing.timer) clearTimeout(existing.timer);
        const timer = setTimeout(() => __flushWrite(key), STORAGE_DEBOUNCE_MS);
        __pendingWrites.set(key, { next, timer });
      }, [key]);

      return [value, persist, loaded];
    }

    // 画面幅からデバイス種別を判定する(スマホ=追加・確認中心のシンプル画面、タブレット以上=フル機能)
    function useViewport() {
      const getCategory = () => {
        if (typeof window === "undefined") return "desktop";
        const w = window.innerWidth;
        if (w < 700) return "phone";
        if (w < 1080) return "tablet";
        return "desktop";
      };
      const [category, setCategory] = useState(getCategory);
      useEffect(() => {
        const onResize = () => setCategory(getCategory());
        window.addEventListener("resize", onResize);
        return () => window.removeEventListener("resize", onResize);
      }, []);
      return category;
    }

    function parseCsv(text) {
      const rows = text.split(/\r?\n/).map(r => r.trim()).filter(Boolean);
      const out = [];
      for (const row of rows) {
        const cells = row.split(/\t|,/).map(c => c.trim()).filter(c => c.length);
        if (cells.length < 2) continue;
        const [name, code] = cells;
        if (/店舗名|拠点コ|コード/.test(name) && /コード/.test(code)) continue;
        out.push({ id: uid(), name, code });
      }
      return out;
    }

    const pad = n => String(n).padStart(2, "0");
    const toISODate = (d) => {
      if (!d) return "";
      if (typeof d === "string") {
        if (/^\d{4}-\d{2}-\d{2}$/.test(d)) return d;
        d = new Date(d);
      }
      if (isNaN(d.getTime())) return "";
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    };

    const fmtJP = (val, time) => {
      if (!val) return "—";
      let str = String(val).trim();
      let y, m, d;
      if (/^\d{4}[-\/]\d{1,2}[-\/]\d{1,2}/.test(str)) {
        const parts = str.split(/[-\/]/);
        y = parts[0];
        m = Number(parts[1]);
        d = Number(parts[2].slice(0, 2));
      } else {
        const dateObj = new Date(str);
        if (!isNaN(dateObj.getTime())) {
          y = dateObj.getFullYear();
          m = dateObj.getMonth() + 1;
          d = dateObj.getDate();
        } else {
          return str;
        }
      }
      if (isNaN(m) || isNaN(d)) return str;
      const datePart = `${y}年${m}月${d}日`;
      return time ? `${datePart} ${time}` : datePart;
    };

    const monthMatrix = (year, month) => {
      const first = new Date(year, month, 1);
      const startDay = first.getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const cells = [];
      for (let i = 0; i < startDay; i++) cells.push(null);
      for (let d = 1; d <= daysInMonth; d++) cells.push(new Date(year, month, d));
      while (cells.length % 7 !== 0) cells.push(null);
      return cells;
    };

    const FULL_TO_HALF_KANA = {
      "ガ":"ｶﾞ","ギ":"ｷﾞ","グ":"ｸﾞ","ゲ":"ｹﾞ","ゴ":"ｺﾞ",
      "ザ":"ｻﾞ","ジ":"ｼﾞ","ズ":"ｽﾞ","ゼ":"ｾﾞ","ゾ":"ｿﾞ",
      "ダ":"ﾀﾞ","ヂ":"ﾁﾞ","ヅ":"ﾂﾞ","デ":"ﾃﾞ","ド":"ﾄﾞ",
      "バ":"ﾊﾞ","ビ":"ﾋﾞ","ブ":"ﾌﾞ","ベ":"ﾍﾞ","ボ":"ﾎﾞ",
      "パ":"ﾊﾟ","ピ":"ﾋﾟ","プ":"ﾌﾟ","ペ":"ﾍﾟ","ポ":"ﾎﾟ",
      "ヴ":"ｳﾞ","ア":"ｱ","イ":"ｲ","ウ":"ｳ","エ":"ｴ","オ":"ｵ",
      "カ":"ｶ","キ":"ｷ","ク":"ｸ","ケ":"ｹ","コ":"ｺ",
      "サ":"ｻ","シ":"ｼ","ス":"ｽ","セ":"ｾ","ソ":"ｿ",
      "タ":"ﾀ","チ":"ﾁ","ツ":"ﾂ","テ":"ﾃ","ト":"ﾄ",
      "ナ":"ﾅ","ニ":"ﾆ","ヌ":"ﾇ","ネ":"ﾈ","ノ":"ﾉ",
      "ハ":"ﾊ","ヒ":"ﾋ","フ":"ﾌ","ヘ":"ﾍ","ﾎﾞ":"ﾎ",
      "マ":"ﾏ","ミ":"ﾐ","ム":"ﾑ","メ":"ﾒ","モ":"ﾓ",
      "ヤ":"ﾔ","ユ":"ﾕ","ヨ":"ﾖ","ラ":"ﾗ","リ":"ﾘ",
      "ル":"ﾙ","レ":"ﾚ","ロ":"ﾛ","ワ":"ﾜ","ヲ":"ｦ","ン":"ﾝ",
      "ァ":"ｧ","ィ":"ｨ","ゥ":"ｩ","ェ":"ｪ","ォ":"ｫ",
      "ッ":"ｯ","ャ":"ｬ","ュ":"ｭ","ョ":"ｮ","ー":"ｰ"
    };

    function toHalfWidth(str) {
      if (!str) return str;
      let res = String(str)
        .replace(/[！-～]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
        .replace(/ /g, " ");
      const kanaPattern = new RegExp(Object.keys(FULL_TO_HALF_KANA).join("|"), "g");
      res = res.replace(kanaPattern, match => FULL_TO_HALF_KANA[match]);
      return res;
    }

    // ================= Main App =================
    function App() {
      const [records, setRecords, recLoaded] = useStorageState(REC_KEY, []);
      const [codes, setCodes, codeLoaded] = useStorageState(CODE_KEY, []);
      const [tags, setTags, tagLoaded] = useStorageState(TAG_KEY, DEFAULT_TAGS);
      const [customerOptions, setCustomerOptions, customerOptLoaded] = useStorageState(CUSTOMER_OPT_KEY, []);
      const [contactOptions, setContactOptions, contactOptLoaded] = useStorageState(CONTACT_OPT_KEY, []);
      const [chargeOptions, setChargeOptions, chargeOptLoaded] = useStorageState(CHARGE_OPT_KEY, []);
      const [modelOptions, setModelOptions, modelOptLoaded] = useStorageState(MODEL_OPT_KEY, []);
      const [customColors, setCustomColors, customColorsLoaded] = useStorageState(CUSTOM_COLORS_KEY, {});
      const [statusesKousei, setStatusesKousei, statusKouseiLoaded] = useStorageState(STATUS_KOUSEI_KEY, DEFAULT_STATUSES_KOUSEI);
      const [statusesShuuri, setStatusesShuuri, statusShuuriLoaded] = useStorageState(STATUS_SHUURI_KEY, DEFAULT_STATUSES_SHUURI);
      const [statusVisibility, setStatusVisibility, hiddenLoaded] = useStorageState(HIDDEN_STATUS_KEY, {});
      const [boardLayout, setBoardLayout, boardLayoutLoaded] = useStorageState(BOARD_LAYOUT_KEY, "row");
      const [boardRouteFilter, setBoardRouteFilter] = useState("校正");
      const [tableColumnOrder, setTableColumnOrder, tableColLoaded] = useStorageState(TABLE_COL_KEY, DEFAULT_COLUMN_ORDER);
      const [tableHiddenColumns, setTableHiddenColumns, tableHiddenLoaded] = useStorageState(TABLE_HIDDEN_COL_KEY, []);
      const [tableColumnWidths, setTableColumnWidths, tableWidthLoaded] = useStorageState(TABLE_COL_WIDTH_KEY, DEFAULT_COLUMN_WIDTHS);
      const [gasUrl, setGasUrl, gasUrlLoaded] = useStorageState(GAS_URL_KEY, "");
      const [syncing, setSyncing] = useState(false);
      const [showCloudConfig, setShowCloudConfig] = useState(false);
      const device = useViewport(); // "phone" | "tablet" | "desktop"

      // Notion-like Table Sort & Column Filters
      const [columnSort, setColumnSort] = useState(null); // { key: string, direction: 'asc'|'desc' }
      const [columnFilters, setColumnFilters] = useState({}); // { [colKey]: { query?: string, values?: string[] } }

      const [showColumnAdmin, setShowColumnAdmin] = useState(false);
      const [view, setView] = useState("table");
      const [showForm, setShowForm] = useState(false);
      const [editing, setEditing] = useState(null);
      const [showImport, setShowImport] = useState(false);
      const [showTagAdmin, setShowTagAdmin] = useState(false);
      const [calCursor, setCalCursor] = useState(() => {
        const t = new Date();
        return { y: t.getFullYear(), m: t.getMonth() };
      });
      const [calAxis, setCalAxis] = useState("precheck");
      const [searchQuery, setSearchQuery] = useState("");
      const [showEquip, setShowEquip] = useState(null);
      const [showShortcuts, setShowShortcuts] = useState(false);
      const [showStatusAdmin, setShowStatusAdmin] = useState(false);
      const searchInputRef = useRef(null);
      const backupInputRef = useRef(null);

      const [undoStack, setUndoStack] = useState([]);
      const [redoStack, setRedoStack] = useState([]);
      const HISTORY_LIMIT = 50;

      const getStatusesForKind = useCallback((kind) => {
        if (kind === "校正") return statusesKousei;
        return statusesShuuri;
      }, [statusesKousei, statusesShuuri]);

      const pushUndo = () => {
        setUndoStack(prev => [...prev.slice(-HISTORY_LIMIT + 1), { records, codes, tags, statusesKousei, statusesShuuri, customerOptions, contactOptions, chargeOptions, modelOptions, customColors }]);
        setRedoStack([]);
      };
      const undo = () => {
        setUndoStack(prev => {
          if (prev.length === 0) return prev;
          const snap = prev[prev.length - 1];
          setRedoStack(r => [...r, { records, codes, tags, statusesKousei, statusesShuuri, customerOptions, contactOptions, chargeOptions, modelOptions, customColors }]);
          setRecords(snap.records);
          setCodes(snap.codes);
          setTags(snap.tags);
          setStatusesKousei(snap.statusesKousei || DEFAULT_STATUSES_KOUSEI);
          setStatusesShuuri(snap.statusesShuuri || DEFAULT_STATUSES_SHUURI);
          setCustomerOptions(snap.customerOptions || []);
          setContactOptions(snap.contactOptions || []);
          setChargeOptions(snap.chargeOptions || []);
          setModelOptions(snap.modelOptions || []);
          setCustomColors(snap.customColors || {});
          return prev.slice(0, -1);
        });
      };
      const redo = () => {
        setRedoStack(prev => {
          if (prev.length === 0) return prev;
          const snap = prev[prev.length - 1];
          setUndoStack(u => [...u, { records, codes, tags, statusesKousei, statusesShuuri, customerOptions, contactOptions, chargeOptions, modelOptions, customColors }]);
          setRecords(snap.records);
          setCodes(snap.codes);
          setTags(snap.tags);
          setStatusesKousei(snap.statusesKousei || DEFAULT_STATUSES_KOUSEI);
          setStatusesShuuri(snap.statusesShuuri || DEFAULT_STATUSES_SHUURI);
          setCustomerOptions(snap.customerOptions || []);
          setContactOptions(snap.contactOptions || []);
          setChargeOptions(snap.chargeOptions || []);
          setModelOptions(snap.modelOptions || []);
          setCustomColors(snap.customColors || {});
          return prev.slice(0, -1);
        });
      };

      const ready = recLoaded && codeLoaded && tagLoaded && customerOptLoaded && contactOptLoaded && chargeOptLoaded && modelOptLoaded && customColorsLoaded && statusKouseiLoaded && statusShuuriLoaded && hiddenLoaded && boardLayoutLoaded && tableColLoaded && tableHiddenLoaded && tableWidthLoaded && gasUrlLoaded;

      const getColor = useCallback((val, fallbackIdx = 0) => {
        if (!val) return "#6b6658";
        if (customColors[val]) return customColors[val];
        return defaultColorFor(fallbackIdx);
      }, [customColors]);

      const setOptionColor = (val, color) => {
        pushUndo();
        setCustomColors(prev => ({ ...prev, [val]: color }));
      };

      // 複合フィルター＆検索
      const filtered = useMemo(() => {
        let list = [...records];
        const q = searchQuery.trim().toLowerCase();
        if (q) {
          list = list.filter(r => {
            const dealer = dealerFor(r.code);
            const hay = [r.subject, r.kind, r.code, r.tag, dealer?.name, dealer?.customerName, r.note, r.customer, r.contactName, r.personInCharge, r.model, r.content]
              .filter(Boolean).join(" ").toLowerCase();
            return hay.includes(q);
          });
        }

        // 列個別フィルターの適用
        Object.keys(columnFilters).forEach(key => {
          const conf = columnFilters[key];
          if (!conf) return;
          if (conf.query && conf.query.trim()) {
            const subQ = conf.query.trim().toLowerCase();
            list = list.filter(r => String(r[key] || "").toLowerCase().includes(subQ));
          }
          if (conf.values && conf.values.length > 0) {
            list = list.filter(r => conf.values.includes(r[key] || ""));
          }
        });

        return list;
      }, [records, searchQuery, columnFilters]);

      // ソート処理
      const sorted = useMemo(() => {
        let list = [...filtered];
        if (columnSort && columnSort.key) {
          const { key, direction } = columnSort;
          list.sort((a, b) => {
            const valA = String(a[key] || "");
            const valB = String(b[key] || "");
            const comp = valA.localeCompare(valB, "ja", { numeric: true });
            return direction === "asc" ? comp : -comp;
          });
        } else {
          // デフォルト: 直近の日時順
          list.sort((a, b) => {
            const da = a.precheckDate || a.visitDate || a.workDate || "9999";
            const db = b.precheckDate || b.visitDate || b.workDate || "9999";
            if (da !== db) return da.localeCompare(db);
            return (a.precheckTime || a.visitTime || a.workTime || "").localeCompare(b.precheckTime || b.visitTime || b.workTime || "");
          });
        }
        return list;
      }, [filtered, columnSort]);

      // ---------- Enhanced Cloud (GAS) Background Sync ----------
      const autoSyncToCloud = async (currentRecords) => {
        if (!gasUrl.trim()) return;
        try {
          await fetch(gasUrl.trim(), {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ syncRecords: currentRecords }),
          });
        } catch (e) {
          console.error("Auto sync push error:", e);
        }
      };

      const silentFetchFromCloud = useCallback(async () => {
        if (!gasUrl.trim() || syncing) return;
        try {
          const res = await fetch(gasUrl.trim(), {
            method: "GET",
            mode: "cors",
            redirect: "follow"
          });
          if (!res.ok) return;
          const json = await res.json();
          if (json && Array.isArray(json.records) && json.records.length > 0) {
            setRecords(prev => {
              const map = new Map(prev.map(r => [r.id, r]));
              let hasChange = false;
              json.records.forEach(r => {
                if (r.id) {
                  const cleaned = {
                    ...r,
                    precheckDate: toISODate(r.precheckDate),
                    visitDate: toISODate(r.visitDate),
                    workDate: toISODate(r.workDate),
                    receivedDate: toISODate(r.receivedDate),
                    honkouseiDate: toISODate(r.honkouseiDate),
                  };
                  const existing = map.get(r.id);
                  if (!existing || JSON.stringify(existing) !== JSON.stringify(cleaned)) {
                    map.set(r.id, cleaned);
                    hasChange = true;
                  }
                }
              });
              return hasChange ? Array.from(map.values()) : prev;
            });
          }
        } catch (e) {
          console.warn("Silent cloud fetch skipped:", e);
        }
      }, [gasUrl, syncing]);

      useEffect(() => {
        if (!gasUrl.trim()) return;
        silentFetchFromCloud();

        const interval = setInterval(() => {
          if (!showForm && !showEquip) {
            silentFetchFromCloud();
          }
        }, 30000);

        const onFocus = () => {
          if (!showForm && !showEquip) {
            silentFetchFromCloud();
          }
        };
        window.addEventListener("focus", onFocus);

        return () => {
          clearInterval(interval);
          window.removeEventListener("focus", onFocus);
        };
      }, [gasUrl, showForm, showEquip, silentFetchFromCloud]);

      const saveRecord = (rec, openEquipAfter = false) => {
        pushUndo();
        const currentKind = rec.kind || "校正";
        const validStatuses = getStatusesForKind(currentKind);
        const defaultStatus = validStatuses[0] || "";

        let targetRecord = null;
        let nextRecords = [];
        if (rec.id) {
          targetRecord = { ...rec, status: rec.status || defaultStatus };
          nextRecords = records.map(r => r.id === rec.id ? targetRecord : r);
        } else {
          targetRecord = { ...rec, id: uid(), kind: currentKind, status: rec.status || defaultStatus, equipmentSheets: rec.equipmentSheets || [] };
          nextRecords = [...records, targetRecord];
        }
        setRecords(nextRecords);
        autoSyncToCloud(nextRecords);

        setShowForm(false);
        setEditing(null);

        if (openEquipAfter && targetRecord) {
          setShowEquip(targetRecord);
        }
      };

      const deleteRecord = (id) => {
        if (!window.confirm("この予定を削除しますか？")) return;
        pushUndo();
        const nextRecords = records.filter(r => r.id !== id);
        setRecords(nextRecords);
        autoSyncToCloud(nextRecords);
      };

      const updateRecordField = (id, field, value) => {
        pushUndo();
        if (field === "customer" && value) setCustomerOptions(prev => prev.includes(value) ? prev : [...prev, value]);
        if (field === "contactName" && value) setContactOptions(prev => prev.includes(value) ? prev : [...prev, value]);
        if (field === "personInCharge" && value) setChargeOptions(prev => prev.includes(value) ? prev : [...prev, value]);
        if (field === "model" && value) setModelOptions(prev => prev.includes(value) ? prev : [...prev, value]);
        
        let nextRecords = [];
        if (field === "kind") {
          const nextStatuses = getStatusesForKind(value);
          nextRecords = records.map(r => r.id === id ? { ...r, [field]: value, status: nextStatuses.includes(r.status) ? r.status : nextStatuses[0] } : r);
        } else {
          nextRecords = records.map(r => r.id === id ? { ...r, [field]: value } : r);
        }
        setRecords(nextRecords);
        autoSyncToCloud(nextRecords);
      };

      const updateRecordDateTime = (id, dateField, dateValue, timeField, timeValue) => {
        pushUndo();
        const nextRecords = records.map(r => r.id === id ? { ...r, [dateField]: toISODate(dateValue), [timeField]: timeValue } : r);
        setRecords(nextRecords);
        autoSyncToCloud(nextRecords);
      };

      const saveEquipmentSheets = (recordId, equipmentSheets) => {
        pushUndo();
        const nextRecords = records.map(r => r.id === recordId ? { ...r, equipmentSheets } : r);
        setRecords(nextRecords);
        autoSyncToCloud(nextRecords);
        if (editing && editing.id === recordId) {
          setEditing(prev => ({ ...prev, equipmentSheets }));
        }
      };

      const addTag = (name) => {
        if (!name.trim() || tags.includes(name.trim())) return;
        pushUndo();
        setTags([...tags, name.trim()]);
      };
      const removeTag = (name) => {
        pushUndo();
        setTags(tags.filter(t => t !== name));
      };

      const addStatus = (kind, name) => {
        if (!name.trim()) return;
        pushUndo();
        if (kind === "校正") {
          if (!statusesKousei.includes(name.trim())) setStatusesKousei([...statusesKousei, name.trim()]);
        } else {
          if (!statusesShuuri.includes(name.trim())) setStatusesShuuri([...statusesShuuri, name.trim()]);
        }
      };
      const renameStatus = (kind, oldName, newName) => {
        if (!newName.trim() || oldName === newName.trim()) return;
        pushUndo();
        if (kind === "校正") {
          setStatusesKousei(statusesKousei.map(s => s === oldName ? newName.trim() : s));
        } else {
          setStatusesShuuri(statusesShuuri.map(s => s === oldName ? newName.trim() : s));
        }
        const nextRecords = records.map(r => (r.status === oldName && r.kind === kind) ? { ...r, status: newName.trim() } : r);
        setRecords(nextRecords);
        autoSyncToCloud(nextRecords);
      };
      const removeStatus = (kind, name) => {
        const inUse = records.filter(r => r.status === name && r.kind === kind).length;
        if (inUse > 0 && !window.confirm(`「${name}」には${inUse}件の予定が入っています。削除すると未設定に戻ります。よろしいですか？`)) return;
        pushUndo();
        if (kind === "校正") {
          setStatusesKousei(statusesKousei.filter(s => s !== name));
        } else {
          setStatusesShuuri(statusesShuuri.filter(s => s !== name));
        }
        const nextRecords = records.map(r => (r.status === name && r.kind === kind) ? { ...r, status: "" } : r);
        setRecords(nextRecords);
        autoSyncToCloud(nextRecords);
      };
      const reorderStatuses = (kind, fromIdx, toIdx) => {
        if (fromIdx === toIdx) return;
        pushUndo();
        if (kind === "校正") {
          const next = [...statusesKousei];
          const [moved] = next.splice(fromIdx, 1);
          next.splice(toIdx, 0, moved);
          setStatusesKousei(next);
        } else {
          const next = [...statusesShuuri];
          const [moved] = next.splice(fromIdx, 1);
          next.splice(toIdx, 0, moved);
          setStatusesShuuri(next);
        }
      };

      const moveRecordStatus = (recordId, newStatus) => {
        pushUndo();
        const nextRecords = records.map(r => r.id === recordId ? { ...r, status: newStatus } : r);
        setRecords(nextRecords);
        autoSyncToCloud(nextRecords);
      };

      const reorderTableColumns = (fromIdx, toIdx) => {
        if (fromIdx === toIdx) return;
        const next = [...tableColumnOrder];
        const [moved] = next.splice(fromIdx, 1);
        next.splice(toIdx, 0, moved);
        setTableColumnOrder(next);
      };
      const toggleColumnHidden = (key) => {
        setTableHiddenColumns(
          tableHiddenColumns.includes(key) ? tableHiddenColumns.filter(k => k !== key) : [...tableHiddenColumns, key]
        );
      };
      const setColumnWidth = (key, width) => {
        setTableColumnWidths({ ...tableColumnWidths, [key]: Math.round(width) });
      };
      const toggleStatusHidden = (name, level) => {
        setStatusVisibility({ ...statusVisibility, [name]: level });
      };

      const fetchFromCloud = async () => {
        if (!gasUrl.trim()) {
          setShowCloudConfig(true);
          return;
        }
        setSyncing(true);
        try {
          const res = await fetch(gasUrl.trim(), {
            method: "GET",
            mode: "cors",
            redirect: "follow"
          });
          if (!res.ok) throw new Error(`サーバーエラー (HTTP ${res.status})`);
          const json = await res.json();
          if (json && Array.isArray(json.records)) {
            pushUndo();
            const map = new Map(records.map(r => [r.id, r]));
            json.records.forEach(r => {
              if (r.id) {
                map.set(r.id, {
                  ...r,
                  precheckDate: toISODate(r.precheckDate),
                  visitDate: toISODate(r.visitDate),
                  workDate: toISODate(r.workDate),
                  receivedDate: toISODate(r.receivedDate),
                  honkouseiDate: toISODate(r.honkouseiDate),
                });
              }
            });
            const merged = Array.from(map.values());
            setRecords(merged);
            alert(`クラウドから ${json.records.length} 件のデータを取得・統合しました。`);
          } else {
            alert("データの取得に失敗しました。正しいURLか確認してください。");
          }
        } catch (e) {
          console.error(e);
          alert("クラウド通信エラーが発生しました: " + e.message);
        } finally {
          setSyncing(false);
        }
      };

      const pushToCloud = async () => {
        if (!gasUrl.trim()) {
          setShowCloudConfig(true);
          return;
        }
        if (!window.confirm("台帳の全データをクラウド（スプレッドシート）へ上書き送信しますか？")) return;
        setSyncing(true);
        try {
          await fetch(gasUrl.trim(), {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ syncRecords: records }),
          });
          alert("クラウドへの一括バックアップ保存が完了しました。");
        } catch (e) {
          console.error(e);
          alert("クラウド通信エラーが発生しました: " + e.message);
        } finally {
          setSyncing(false);
        }
      };

      const importCodes = (rows) => {
        pushUndo();
        const map = new Map(codes.map(c => [c.code || c.name, c]));
        for (const r of rows) map.set(r.code || r.name, r);
        setCodes(Array.from(map.values()));
        setShowImport(false);
      };

      const exportBackup = () => {
        const data = JSON.stringify({ records, codes, tags, statusesKousei, statusesShuuri, customerOptions, contactOptions, chargeOptions, modelOptions, customColors, exportedAt: new Date().toISOString() }, null, 2);
        const blob = new Blob([data], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `kousei-backup-${toISODate(new Date())}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const importBackup = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            const validRecords = Array.isArray(parsed.records)
              ? parsed.records.filter(r => r && typeof r === "object" && typeof r.id === "string" && r.id.length > 0)
              : null;
            const invalidCount = Array.isArray(parsed.records) ? parsed.records.length - (validRecords ? validRecords.length : 0) : 0;
            if (validRecords && (invalidCount === 0 || window.confirm(`${invalidCount}件のレコードは形式不正のためスキップされます。続行しますか？`))) {
              parsed.records = validRecords;
              if (window.confirm("現在のデータが上書きされます。復元しますか？")) {
                pushUndo();
                setRecords(parsed.records || []);
                setCodes(parsed.codes || []);
                setTags(parsed.tags || DEFAULT_TAGS);
                setStatusesKousei(parsed.statusesKousei || DEFAULT_STATUSES_KOUSEI);
                setStatusesShuuri(parsed.statusesShuuri || DEFAULT_STATUSES_SHUURI);
                setCustomerOptions(parsed.customerOptions || []);
                setContactOptions(parsed.contactOptions || []);
                setChargeOptions(parsed.chargeOptions || []);
                setModelOptions(parsed.modelOptions || []);
                setCustomColors(parsed.customColors || {});
                alert("復元が完了しました。");
              }
            } else {
              alert("正しいバックアップファイル形式ではありません。");
            }
          } catch (err) {
            alert("ファイルの読み込みに失敗しました。");
          }
        };
        reader.readAsText(file);
        e.target.value = "";
      };

      useEffect(() => {
        const isTyping = (el) => el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.isContentEditable);

        const onKeyDown = (e) => {
          if (e.key === "Escape") {
            if (showEquip) { setShowEquip(null); return; }
            if (showForm) { setShowForm(false); setEditing(null); return; }
            if (showImport) { setShowImport(false); return; }
            if (showTagAdmin) { setShowTagAdmin(false); return; }
            if (showStatusAdmin) { setShowStatusAdmin(false); return; }
            if (showColumnAdmin) { setShowColumnAdmin(false); return; }
            if (showCloudConfig) { setShowCloudConfig(false); return; }
            if (showShortcuts) { setShowShortcuts(false); return; }
            return;
          }

          const meta = e.ctrlKey || e.metaKey;
          if (meta && !e.shiftKey && e.key.toLowerCase() === "z") {
            e.preventDefault(); undo(); return;
          }
          if (meta && ((e.shiftKey && e.key.toLowerCase() === "z") || e.key.toLowerCase() === "y")) {
            e.preventDefault(); redo(); return;
          }

          if (isTyping(document.activeElement)) return;
          const anyModalOpen = showEquip || showForm || showImport || showTagAdmin || showStatusAdmin || showColumnAdmin || showCloudConfig || showShortcuts;

          if (!anyModalOpen && (e.key === "n" || e.key === "N")) {
            e.preventDefault(); setEditing(null); setShowForm(true); return;
          }
          if (!anyModalOpen && e.key === "/") {
            e.preventDefault(); searchInputRef.current?.focus(); return;
          }
          if (e.key === "?") {
            e.preventDefault(); setShowShortcuts(s => !s); return;
          }
        };

        window.addEventListener("keydown", onKeyDown);
        return () => window.removeEventListener("keydown", onKeyDown);
      }, [records, codes, tags, statusesKousei, statusesShuuri, customerOptions, contactOptions, chargeOptions, modelOptions, customColors, showEquip, showForm, showImport, showTagAdmin, showStatusAdmin, showColumnAdmin, showCloudConfig, showShortcuts]);

          </div>

    function ColumnHeaderMenuPopover({ colKey, label, rect, sort, filter, uniqueValues, onSetSort, onSetFilter, onClearFilter, onHideColumn, onClose }) {
      const [filterQuery, setFilterQuery] = useState(filter?.query || "");
      const [selectedVals, setSelectedVals] = useState(filter?.values || []);

      const toggleVal = (v) => {
        if (selectedVals.includes(v)) {
          setSelectedVals(selectedVals.filter(x => x !== v));
        } else {
          setSelectedVals([...selectedVals, v]);
        }
      };

      const applyFilters = () => {
        onSetFilter(colKey, {
          query: filterQuery,
          values: selectedVals.length > 0 ? selectedVals : undefined
        });
        onClose();
      };

      const handleClear = () => {
        onClearFilter(colKey);
        onClose();
      };

      return (
        <React.Fragment>
          <div style={styles.cellPopoverBackdrop} onClick={onClose} />
          <div style={{ ...styles.notionHeaderMenu, ...popoverStyleFor(rect, 250, 360) }} onClick={e => e.stopPropagation()}>

              <span>{label}</span>
              <button style={styles.iconBtnSm} onClick={onClose}><X size={13} /></button>
            </div>

              <div
                className="notion-menu-item"
                style={sort?.key === colKey && sort?.direction === "asc" ? styles.notionMenuItemActive : {}}
                onClick={() => { onSetSort(colKey, sort?.key === colKey && sort?.direction === "asc" ? null : "asc"); onClose(); }}

              <div
                className="notion-menu-item"
                style={sort?.key === colKey && sort?.direction === "desc" ? styles.notionMenuItemActive : {}}
                onClick={() => { onSetSort(colKey, sort?.key === colKey && sort?.direction === "desc" ? null : "desc"); onClose(); }}

              <div style={styles.notionMenuLabel}><Filter size={12} /> フィルター</div>
              <input
                style={styles.notionMenuInput}

    function popoverStyleFor(rect, width = 260, estHeight = 280) {
      if (!rect) return null;
      const margin = 12;
      let left = rect.left;
      if (left + width + margin > window.innerWidth) left = Math.max(margin, window.innerWidth - width - margin);
      let top = rect.bottom + 4;
      if (top + estHeight + margin > window.innerHeight) top = Math.max(margin, rect.top - estHeight - 4);
      return { position: "fixed", left, top, width };
    }

    function TextCellPopover({ initialValue, rect, multiline, onSave, onClose }) {
      const [value, setValue] = useState(initialValue || "");

                onChange={e => setValue(e.target.value)}
                onKeyDown={e => {

              />

    function DateTimeCellPopover({ initialDate, initialTime, rect, onSave, onClose }) {
      const [date, setDate] = useState(initialDate || "");
      const [time, setTime] = useState(initialTime || "");
      const [cursor, setCursor] = useState(() => {
        const base = initialDate ? new Date(initialDate + "T00:00:00") : new Date();
        return { y: base.getFullYear(), m: base.getMonth() };
      });
      const cells = useMemo(() => monthMatrix(cursor.y, cursor.m), [cursor]);

      const move = (delta) => {
        let nm = cursor.m + delta, ny = cursor.y;
        if (nm < 0) { nm = 11; ny -= 1; }
        if (nm > 11) { nm = 0; ny += 1; }
        setCursor({ y: ny, m: nm });
      };

      const pickDate = (d) => {
        const nextDate = toISODate(d);
        setDate(nextDate);
        onSave(nextDate, time);
      };

      const changeTime = (t) => {
        setTime(t);
        onSave(date, t);
      };

      const clearAll = () => {
        onSave("", "");
        onClose();
      };

      const todayIso = toISODate(new Date());

      return (
        <React.Fragment>
          <div style={styles.cellPopoverBackdrop} onClick={onClose} />
          <div style={{ ...styles.cellPopover, ...popoverStyleFor(rect, 240, 340) }} onClick={e => e.stopPropagation()}>
            <div style={{ display: "flex", gap: 6, alignItems: "center", marginBottom: 6 }}>
              <input
                type="time"
                style={{ ...styles.cellPopoverInput, flex: 1, textAlign: "center" }}
                value={time || ""}
                onChange={e => changeTime(e.target.value)}
              />
              {time && (
                <button style={styles.iconBtnSm} onClick={() => changeTime("")} title="時刻をクリア">
                  <X size={11} />
                </button>
              )}
            </div>
            <div style={styles.calNav}>
              <button type="button" style={styles.iconBtn} onClick={() => move(-1)}><ChevronLeft size={13} /></button>
              <div style={{ fontSize: 13, fontWeight: 600, color: ink }}>{cursor.y}年 {cursor.m + 1}月</div>
              <button type="button" style={styles.iconBtn} onClick={() => move(1)}><ChevronRight size={13} /></button>
            </div>
            <div style={styles.dtGrid}>
              {["日", "月", "火", "水", "木", "金", "土"].map(d => (
                <div key={d} style={styles.dtDow}>{d}</div>
              ))}
              {cells.map((d, i) => {
                if (!d) return <div key={i} style={styles.dtCellEmpty} />;
                const iso = toISODate(d);
                const selected = iso === date;
                const isToday = iso === todayIso;
                return (
                  <div
                    key={i}
                    style={{
                      ...styles.dtCell,
                      ...(isToday ? styles.dtCellToday : {}),
                      ...(selected ? styles.dtCellSelected : {})
                    }}
                    onClick={() => pickDate(d)}
                  >
                    {d.getDate()}
                  </div>
                );
              })}
            </div>
            <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
              <button type="button" style={{ ...styles.dtTodayBtn, flex: 1, marginTop: 0 }} onClick={() => pickDate(new Date())}>今日</button>
              <button type="button" style={{ ...styles.dtTodayBtn, flex: 1, marginTop: 0, color: "#c9573f" }} onClick={clearAll}>クリア</button>
            </div>
          </div>
        </React.Fragment>
      );
    }

    function SelectCellPopover({ value, rect, options, colorFn, onSetColor, allowCreate, onSelect, onClose }) {
      const [query, setQuery] = useState("");
      const [paletteFor, setPaletteFor] = useState(null);
      const inputRef = useRef(null);
      useEffect(() => { inputRef.current?.focus(); }, []);

      const filtered = options.filter(o => o.toLowerCase().includes(query.trim().toLowerCase()));
      const exactMatch = options.some(o => o.toLowerCase() === query.trim().toLowerCase());

      const pick = (opt) => { onSelect(opt); onClose(); };
      const create = () => {
        if (!query.trim()) return;
        onSelect(query.trim());
        onClose();
      };

      return (
        <React.Fragment>
          <div style={styles.cellPopoverBackdrop} onClick={onClose} />
          <div style={{ ...styles.cellPopover, ...popoverStyleFor(rect, 260, 320) }} onClick={e => e.stopPropagation()}>
            {value && (
              <div style={styles.cellPopoverCurrent}>
                <span style={{ ...styles.pill, background: colorFn(value) }}>{value}</span>
                <button style={styles.searchClear} onClick={() => { onSelect(""); onClose(); }}><X size={12} /></button>
              </div>
            )}
            <input
              ref={inputRef}
              style={styles.cellPopoverInput}
              placeholder="オプションを検索するか作成..."
              value={query}
              onChange={e => setQuery(e.target.value)}
              onKeyDown={e => { if (e.key === "Enter" && query.trim() && !exactMatch && allowCreate) create(); if (e.key === "Escape") onClose(); }}
            />
            <div style={styles.cellPopoverList}>
              {filtered.map((opt, i) => (
                <div key={opt} style={styles.cellPopoverOptionRow}>
                  <div style={{ flex: 1, cursor: "pointer" }} onClick={() => pick(opt)}>
                    <span style={{ ...styles.pill, background: colorFn(opt, i) }}>{opt}</span>
                  </div>
                  {onSetColor && (
                    <button
                      style={styles.paletteTriggerBtn}
                      onClick={(e) => { e.stopPropagation(); setPaletteFor(paletteFor === opt ? null : opt); }}
                      title="色を変更"
                    >
                      <Palette size={12} color="#948d7c" />
                    </button>
                  )}
                  {paletteFor === opt && (
                    <div style={styles.inlineColorPicker}>
                      {CATEGORY_PALETTE.map(c => (
                        <span
                          key={c}
                          style={{ ...styles.colorDot, background: c, border: colorFn(opt, i) === c ? "2px solid #fff" : "1px solid rgba(0,0,0,0.4)" }}
                          onClick={(e) => { e.stopPropagation(); onSetColor(opt, c); setPaletteFor(null); }}
                        />
                      ))}
                    </div>
                  )}
                </div>
              ))}
              {allowCreate && query.trim() && !exactMatch && (
                <div style={styles.cellPopoverCreate} onClick={create}>
                  <Plus size={12} /> 「{query.trim()}」を作成
                </div>
              )}
            </div>
          </div>
        </React.Fragment>
      );
    }

    function NotionPropertySelect({ value, options, colorFn, onSetColor, allowCreate, onSelect }) {
      const [open, setOpen] = useState(false);
      const [anchor, setAnchor] = useState(null);

      const handleClick = (e) => {
        setAnchor(e.currentTarget.getBoundingClientRect());
        setOpen(true);
      };

      return (
        <div>
          <div className="prop-select-btn" onClick={handleClick}>
            {value ? (
              <span style={{ ...styles.pill, background: colorFn(value) }}>{value}</span>
            ) : (
              <span className="prop-unselected">未入力</span>
            )}
          </div>
          {open && (
            <SelectCellPopover
              value={value}
              rect={anchor}
              options={options}
              colorFn={colorFn}
              onSetColor={onSetColor}
              allowCreate={allowCreate}
              onSelect={onSelect}
              onClose={() => setOpen(false)}
            />
          )}
        </div>
      );
    }

    const TABLE_COLUMN_DEFS = {
      subject: { label: "拠点名 (件名)", editable: "text", bold: true },
      kind: { label: "種別", editable: "select-kind" },
      customer: { label: "得意先", editable: "select-customer" },
      contactName: { label: "営業担当", editable: "select-contact" },
      personInCharge: { label: "担当者", editable: "select-charge" },
      model: { label: "型式", editable: "select-model" },
      serialYear: { label: "製造番号・年式", editable: "text" },
      content: { label: "内容", editable: "textarea" },
      receivedDate: { label: "受付日時", editable: "datetime", dateField: "receivedDate", timeField: "receivedTime" },
      visitDate: { label: "対応日程(訪問)", editable: "datetime", dateField: "visitDate", timeField: "visitTime" },
      workDate: { label: "作業日程(修理)", editable: "datetime", dateField: "workDate", timeField: "workTime" },
      tag: { label: "NSS", editable: "select-tag" },
      code: { label: "コード", editable: null },
      precheckDate: { label: "事前点検日時", editable: "datetime", dateField: "precheckDate", timeField: "precheckTime" },
      honkouseiDate: { label: "本校正日時", editable: "datetime", dateField: "honkouseiDate", timeField: "honkouseiTime" },
      status: { label: "手配状況", editable: "select-status" },
    };

    function TableView({
      records, allRecords, codes, tags, customerOptions, contactOptions, chargeOptions, modelOptions, columnOrder, hiddenColumns, columnWidths,
      columnSort, columnFilters, onSetSort, onSetFilter, onClearFilter, onToggleHidden,
      onReorderColumns, onSetColumnWidth,
      onEdit, onDelete, onOpenEquip, onUpdateField, onUpdateDateTime, getStatusesForKind, getColor, onSetOptionColor,
    }) {
      const [activeCell, setActiveCell] = useState(null);
      const [activeHeaderMenu, setActiveHeaderMenu] = useState(null); // { key: string, rect: DOMRect }
      const [resizing, setResizing] = useState(null);
      const [liveWidth, setLiveWidth] = useState(null);

      const visibleColumns = useMemo(
        () => columnOrder.filter(k => TABLE_COLUMN_DEFS[k] && !hiddenColumns.includes(k)),
        [columnOrder, hiddenColumns]
      );

      const widthFor = (key) => {
        if (liveWidth && liveWidth.key === key) return liveWidth.width;
        return columnWidths[key] || DEFAULT_COLUMN_WIDTHS[key] || 140;
      };

      useEffect(() => {
        if (!resizing) return;
        const onMove = (e) => {
          const delta = e.clientX - resizing.startX;
          const next = Math.max(MIN_COL_WIDTH, resizing.startWidth + delta);
          setLiveWidth({ key: resizing.key, width: next });
        };
        const onUp = () => {
          setLiveWidth(cur => {
            if (cur) onSetColumnWidth(cur.key, cur.width);
            return null;
          });
          setResizing(null);
        };
        window.addEventListener("mousemove", onMove);
        window.addEventListener("mouseup", onUp);
        return () => {
          window.removeEventListener("mousemove", onMove);
          window.removeEventListener("mouseup", onUp);
        };
      }, [resizing, onSetColumnWidth]);

      const startResize = (e, key) => {
        e.preventDefault();
        e.stopPropagation();
        setResizing({ key, startX: e.clientX, startWidth: widthFor(key) });
      };

      if (records.length === 0 && allRecords.length === 0) {
        return (
          <div style={styles.empty}>
            <div style={styles.emptyTitle}>まだ登録がありません</div>
            <div style={styles.emptySub}>「新規登録」から校正・修理対応の予定を追加してください。</div>
          </div>
        );
      }

      const openCell = (e, id, field) => {
        e.stopPropagation();
        setActiveCell({ id, field, rect: e.currentTarget.getBoundingClientRect() });
      };
      const activeRecord = activeCell ? records.find(r => r.id === activeCell.id) : null;

      const openHeaderMenu = (e, key) => {
        e.stopPropagation();
        setActiveHeaderMenu({ key, rect: e.currentTarget.getBoundingClientRect() });
      };

      const getUniqueValuesForCol = (key) => {
        const set = new Set();
        allRecords.forEach(r => {
          if (r[key]) set.add(r[key]);
        });
        return Array.from(set);
      };

      const renderCellContent = (key, r) => {
        switch (key) {
          case "subject":
            return r.subject || <span className="ledger-empty-plus">＋</span>;
          case "kind":
            return r.kind
              ? <span style={{ ...styles.pill, background: getColor(r.kind, 0) }}>{r.kind}</span>
              : <span className="ledger-empty-plus">＋</span>;
          case "customer":
            return r.customer
              ? <span style={{ ...styles.pill, background: getColor(r.customer, customerOptions.indexOf(r.customer)) }}>{r.customer}</span>
              : <span className="ledger-empty-plus">＋</span>;
          case "contactName":
            return r.contactName
              ? <span style={{ ...styles.pill, background: getColor(r.contactName, contactOptions.indexOf(r.contactName)) }}>{r.contactName}</span>
              : <span className="ledger-empty-plus">＋</span>;
          case "personInCharge":
            return r.personInCharge
              ? <span style={{ ...styles.pill, background: getColor(r.personInCharge, chargeOptions.indexOf(r.personInCharge)) }}>{r.personInCharge}</span>
              : <span className="ledger-empty-plus">＋</span>;
          case "model":
            return r.model
              ? <span style={{ ...styles.pill, background: getColor(r.model, modelOptions.indexOf(r.model)) }}>{r.model}</span>
              : <span className="ledger-empty-plus">＋</span>;
          case "serialYear":
            return r.serialYear || <span className="ledger-empty-plus">＋</span>;
          case "content":
            return r.content
              ? <span style={styles.tdTruncate}>{r.content}</span>
              : <span className="ledger-empty-plus">＋</span>;
          case "receivedDate":
            return r.receivedDate ? fmtJP(r.receivedDate, r.receivedTime) : <span className="ledger-empty-plus">＋</span>;
          case "visitDate":
            return r.visitDate ? fmtJP(r.visitDate, r.visitTime) : <span className="ledger-empty-plus">＋</span>;
          case "workDate":
            return r.workDate ? fmtJP(r.workDate, r.workTime) : <span className="ledger-empty-plus">＋</span>;
          case "tag":
            return r.tag
              ? <span style={{ ...styles.pill, background: getColor(r.tag, tags.indexOf(r.tag)) }}>{r.tag}</span>
              : <span className="ledger-empty-plus">＋</span>;
          case "code":
            return (
              <span
                style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#8f8a7c", cursor: "pointer" }}
                onClick={(e) => { e.stopPropagation(); if (r.code) { copyToClipboard(r.code); alert(`コード「${r.code}」をコピーしました`); } }}
                title="クリックでコードをコピー"
              >
                {r.code || "—"}
                {r.code && dealerFor(r.code) && <span style={styles.tdDealer}> {dealerFor(r.code).name}</span>}
              </span>
            );
          case "precheckDate":
            return r.precheckDate ? fmtJP(r.precheckDate, r.precheckTime) : <span className="ledger-empty-plus">＋</span>;
          case "honkouseiDate":
            return r.honkouseiDate ? fmtJP(r.honkouseiDate, r.honkouseiTime) : <span className="ledger-empty-plus">＋</span>;
          case "status":
            const currentStatuses = getStatusesForKind(r.kind || "校正");
            return r.status
              ? <span style={{ ...styles.pill, background: getColor(r.status, currentStatuses.indexOf(r.status)) }}>{r.status}</span>
              : <span className="ledger-empty-plus">＋</span>;
          default:
            return null;
        }
      };

      return (
        <div style={styles.tableWrap}>
          <table style={{ ...styles.table, tableLayout: "fixed" }}>
            <colgroup>
              <col style={{ width: 80 }} />
              {visibleColumns.map(key => <col key={key} style={{ width: widthFor(key) }} />)}
            </colgroup>
            <thead>
              <tr>
                <th className="ledger-th ledger-sticky-cell" style={{ ...styles.th, ...styles.thSticky }}></th>
                {visibleColumns.map((key) => {
                  const def = TABLE_COLUMN_DEFS[key];
                  const hasSort = columnSort?.key === key;
                  const hasFilter = !!columnFilters[key];

                  return (
                    <th
                      key={key}
                      className="ledger-th"
                      style={{
                        ...styles.th,
                        position: "relative",
                        ...(hasSort || hasFilter ? styles.thActiveFilter : {})
                      }}
                      onClick={(e) => openHeaderMenu(e, key)}
                      title="クリックして並び替え・フィルターメニューを開く"
                    >
                      <div style={styles.thLabelWrap}>
                        <span style={styles.thLabelText}>{def.label}</span>
                        {hasSort && (
                          <span style={styles.thIndicator}>
                            {columnSort.direction === "asc" ? <ArrowUp size={11} color={amber} /> : <ArrowDown size={11} color={amber} />}
                          </span>
                        )}
                        {hasFilter && (
                          <span style={styles.thIndicator}>
                            <Filter size={11} color={amber} />
                          </span>
                        )}
                      </div>
                      <div
                        className="col-resize-handle"
                        style={styles.colResizeHandle}
                        onMouseDown={(e) => startResize(e, key)}
                        onClick={(e) => e.stopPropagation()}
                        title="ドラッグでリサイズ"
                      />
                    </th>
                  );
                })}
              </tr>
            </thead>
            <tbody>
              {records.map((r) => (
                <tr key={r.id} className="ledger-row" style={styles.tr}>
                  <td className="ledger-sticky-cell" style={{ ...styles.td, ...styles.tdSticky, padding: "8px 10px" }}>
                    <div className="ledger-actions" style={styles.actionsGrid}>
                      <button style={styles.iconBtnSm} onClick={() => onEdit(r)} title="詳細編集">
                        <Pencil size={13} />
                      </button>
                      <button style={styles.iconBtnSm} onClick={() => onOpenEquip(r)} title="機器点検票">
                        <ClipboardList size={13} />
                      </button>
                      <button style={styles.iconBtnSm} onClick={() => onDelete(r.id)} title="削除">
                        <Trash2 size={13} />
                      </button>
                    </div>
                  </td>
                  {visibleColumns.map((key) => {
                    const def = TABLE_COLUMN_DEFS[key];
                    const cellStyle = {
                      ...styles.td,
                      ...(def.editable ? styles.tdEditable : {}),
                      ...(def.bold ? { fontWeight: 600, fontSize: 13.5, color: ink } : {}),
                      overflow: "hidden", textOverflow: "ellipsis", whiteSpace: def.editable === "textarea" ? "normal" : "nowrap",
                    };
                    return (
                      <td
                        key={key}
                        className={def.editable ? "ledger-cell-editable" : undefined}
                        style={cellStyle}
                        onClick={def.editable ? (e) => openCell(e, r.id, key) : undefined}
                      >
                        {renderCellContent(key, r)}
                      </td>
                    );
                  })}
                </tr>
              ))}
            </tbody>
          </table>

          {/* Notion Header Popover Menu */}
          {activeHeaderMenu && (
            <ColumnHeaderMenuPopover
              colKey={activeHeaderMenu.key}
              label={TABLE_COLUMN_DEFS[activeHeaderMenu.key]?.label}
              rect={activeHeaderMenu.rect}
              sort={columnSort}
              filter={columnFilters[activeHeaderMenu.key]}
              uniqueValues={getUniqueValuesForCol(activeHeaderMenu.key)}
              onSetSort={onSetSort}
              onSetFilter={onSetFilter}
              onClearFilter={onClearFilter}
              onHideColumn={onToggleHidden}
              onClose={() => setActiveHeaderMenu(null)}
            />
          )}

          {activeCell && activeRecord && activeCell.field === "subject" && (
            <TextCellPopover
              initialValue={activeRecord.subject}
              rect={activeCell.rect}
              onSave={(v) => onUpdateField(activeRecord.id, "subject", v)}
              onClose={() => setActiveCell(null)}
            />
          )}
          {activeCell && activeRecord && activeCell.field === "kind" && (
            <SelectCellPopover
              value={activeRecord.kind}
              rect={activeCell.rect}
              options={KIND_OPTIONS}
              colorFn={(v) => getColor(v, 0)}
              onSetColor={onSetOptionColor}
              allowCreate={false}
              onSelect={(v) => onUpdateField(activeRecord.id, "kind", v)}
              onClose={() => setActiveCell(null)}
            />
          )}
          {activeCell && activeRecord && activeCell.field === "contactName" && (
            <SelectCellPopover
              value={activeRecord.contactName}
              rect={activeCell.rect}
              options={contactOptions}
              colorFn={(v) => getColor(v, contactOptions.indexOf(v))}
              onSetColor={onSetOptionColor}
              allowCreate={true}
              onSelect={(v) => onUpdateField(activeRecord.id, "contactName", v)}
              onClose={() => setActiveCell(null)}
            />
          )}
          {activeCell && activeRecord && activeCell.field === "personInCharge" && (
            <SelectCellPopover
              value={activeRecord.personInCharge}
              rect={activeCell.rect}
              options={chargeOptions}
              colorFn={(v) => getColor(v, chargeOptions.indexOf(v))}
              onSetColor={onSetOptionColor}
              allowCreate={true}
              onSelect={(v) => onUpdateField(activeRecord.id, "personInCharge", v)}
              onClose={() => setActiveCell(null)}
            />
          )}
          {activeCell && activeRecord && activeCell.field === "model" && (
            <SelectCellPopover
              value={activeRecord.model}
              rect={activeCell.rect}
              options={modelOptions}
              colorFn={(v) => getColor(v, modelOptions.indexOf(v))}
              onSetColor={onSetOptionColor}
              allowCreate={true}
              onSelect={(v) => onUpdateField(activeRecord.id, "model", v)}
              onClose={() => setActiveCell(null)}
            />
          )}
          {activeCell && activeRecord && activeCell.field === "serialYear" && (
            <TextCellPopover
              initialValue={activeRecord.serialYear}
              rect={activeCell.rect}
              onSave={(v) => onUpdateField(activeRecord.id, "serialYear", toHalfWidth(v))}
              onClose={() => setActiveCell(null)}
            />
          )}
          {activeCell && activeRecord && activeCell.field === "content" && (
            <TextCellPopover
              initialValue={activeRecord.content}
              rect={activeCell.rect}
              multiline
              onSave={(v) => onUpdateField(activeRecord.id, "content", v)}
              onClose={() => setActiveCell(null)}
            />
          )}
          {activeCell && activeRecord && TABLE_COLUMN_DEFS[activeCell.field]?.editable === "datetime" && (
            <DateTimeCellPopover
              initialDate={activeRecord[TABLE_COLUMN_DEFS[activeCell.field].dateField]}
              initialTime={activeRecord[TABLE_COLUMN_DEFS[activeCell.field].timeField]}
              rect={activeCell.rect}
              onSave={(d, t) => onUpdateDateTime(activeRecord.id, TABLE_COLUMN_DEFS[activeCell.field].dateField, d, TABLE_COLUMN_DEFS[activeCell.field].timeField, t)}
              onClose={() => setActiveCell(null)}
            />
          )}
          {activeCell && activeRecord && activeCell.field === "customer" && (
            <SelectCellPopover
              value={activeRecord.customer}
              rect={activeCell.rect}
              options={customerOptions}
              colorFn={(v) => getColor(v, customerOptions.indexOf(v))}
              onSetColor={onSetOptionColor}
              allowCreate={true}
              onSelect={(v) => onUpdateField(activeRecord.id, "customer", v)}
              onClose={() => setActiveCell(null)}
            />
          )}
          {activeCell && activeRecord && activeCell.field === "tag" && (
            <SelectCellPopover
              value={activeRecord.tag}
              rect={activeCell.rect}
              options={tags}
              colorFn={(v, i) => getColor(v, i >= 0 ? i : tags.indexOf(v))}
              onSetColor={onSetOptionColor}
              allowCreate={false}
              onSelect={(v) => onUpdateField(activeRecord.id, "tag", v)}
              onClose={() => setActiveCell(null)}
            />
          )}
          {activeCell && activeRecord && activeCell.field === "status" && (
            <SelectCellPopover
              value={activeRecord.status}
              rect={activeCell.rect}
              options={getStatusesForKind(activeRecord.kind || "校正")}
              colorFn={(v) => getColor(v, getStatusesForKind(activeRecord.kind || "校正").indexOf(v))}
              onSetColor={onSetOptionColor}
              allowCreate={false}
              onSelect={(v) => onUpdateField(activeRecord.id, "status", v)}
              onClose={() => setActiveCell(null)}
            />
          )}
        </div>
      );
    }

    // ================= Table Column Admin =================
    function TableColumnAdmin({ columnOrder, hiddenColumns, onReorder, onToggleHidden, onClose }) {
      const [dragIdx, setDragIdx] = useState(null);

      return (
        <div style={styles.overlay} onClick={onClose}>
          <div style={styles.modal} onClick={e => e.stopPropagation()}>
            <div style={styles.modalHead}>
              <div style={styles.modalTitle}>列を表示 / 非表示</div>
              <button style={styles.iconBtn} onClick={onClose}><X size={16} /></button>
            </div>
            <div style={styles.statusAdminHint}>ドラッグして並び替え、目のアイコンで表示/非表示を切替</div>
            <div style={styles.tagAdminList}>
              {columnOrder.map((key, idx) => {
                const def = TABLE_COLUMN_DEFS[key];
                if (!def) return null;
                const isHidden = hiddenColumns.includes(key);
                return (
                  <div
                    key={key}
                    style={{
                      ...styles.statusAdminRow,
                      ...(dragIdx === idx ? styles.statusAdminRowDragging : {}),
                      ...(isHidden ? styles.statusAdminRowHidden : {}),
                    }}
                    draggable
                    onDragStart={() => setDragIdx(idx)}
                    onDragOver={(e) => e.preventDefault()}
                    onDrop={() => { if (dragIdx !== null && dragIdx !== idx) onReorder(dragIdx, idx); setDragIdx(null); }}
                    onDragEnd={() => setDragIdx(null)}
                  >
                    <GripVertical size={14} color="#6b6658" />
                    <span style={styles.statusAdminName}>{def.label}</span>
                    <button
                      style={styles.iconBtn}
                      onClick={() => onToggleHidden(key)}
                      title={isHidden ? "表示する" : "非表示にする"}
                    >
                      {isHidden ? <EyeOff size={14} /> : <Eye size={14} />}
                    </button>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // ================= Mobile Phone View (スマホ: 追加・確認中心) =================
    function MobilePhoneView({ records, codes, tags, searchQuery, setSearchQuery, onAdd, onEdit, onOpenEquip, getColor, exportBackup, onImportBackupClick, gasUrl, syncing, fetchFromCloud, onOpenCloudConfig }) {
      const [showMenu, setShowMenu] = useState(false);

      const fmtDateShort = (iso, time) => {
        if (!iso) return "";
        const d = new Date(iso + "T00:00:00");
        if (Number.isNaN(d.getTime())) return iso;
        const s = `${d.getMonth() + 1}/${d.getDate()}(${"日月火水木金土"[d.getDay()]})`;
        return time ? `${s} ${time}` : s;
      };

      return (
        <div style={{ display: "flex", flexDirection: "column", minHeight: "calc(100vh - 40px)" }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14, gap: 10 }}>
            <div>
              <div style={{ fontSize: 10, letterSpacing: "0.14em", color: "#8f8a7c", textTransform: "uppercase", marginBottom: 4 }}>受付台帳</div>
              <div style={{ fontSize: 18, fontWeight: 600 }}>校正・修理対応</div>
            </div>
            <button
              style={{ width: 38, height: 38, borderRadius: 10, border: "1px solid #3a352b", background: "#1c1a15", color: "#c7c1b3", display: "flex", alignItems: "center", justifyContent: "center" }}
              onClick={() => setShowMenu(true)}
              title="メニュー"
            >
              <Menu size={18} />
            </button>
          </div>

          <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "9px 12px", borderRadius: 10, border: "1px solid #3a352b", background: "#151310", marginBottom: 12 }}>
            <Search size={14} color="#6b6658" />
            <input
              style={{ flex: 1, background: "transparent", border: "none", outline: "none", color: "#e9e4d8", fontSize: 14 }}
              placeholder="検索(拠点名・得意先など)"
              value={searchQuery}
              onChange={e => setSearchQuery(e.target.value)}
            />
            {searchQuery && (
              <button style={{ background: "transparent", border: "none", color: "#8f8a7c" }} onClick={() => setSearchQuery("")}><X size={14} /></button>
            )}
          </div>

    // ================= Calendar View =================
    function CalendarView({ records, codes, tags, cursor, setCursor, axis, setAxis, onEdit, getColor }) {
      const { y, m } = cursor;
      const cells = useMemo(() => monthMatrix(y, m), [y, m]);
      const byDate = useMemo(() => {
        const map = {};
        for (const r of records) {
          const iso = axis === "precheck" ? (r.precheckDate || r.visitDate) : (r.honkouseiDate || r.workDate);
          if (!iso) continue;
          (map[iso] = map[iso] || []).push(r);
        }
        for (const iso in map) {
          map[iso].sort((a, b) => {
            const ta = (axis === "precheck" ? (a.precheckTime || a.visitTime) : (a.honkouseiTime || a.workTime)) || "";
            const tb = (axis === "precheck" ? (b.precheckTime || b.visitTime) : (b.honkouseiTime || b.workTime)) || "";
            return ta.localeCompare(tb);
          });
        }
        return map;
      }, [records, axis]);

      const move = (delta) => {
        let nm = m + delta, ny = y;
        if (nm < 0) { nm = 11; ny -= 1; }
        if (nm > 11) { nm = 0; ny += 1; }
        setCursor({ y: ny, m: nm });
      };

      const todayIso = toISODate(new Date());

      return (
        <div>
          <div style={styles.calHeader}>
            <div style={styles.calNav}>
              <button style={styles.iconBtn} onClick={() => move(-1)}><ChevronLeft size={16} /></button>
              <div style={styles.calMonthLabel}>{y}年 {m + 1}月</div>
              <button style={styles.iconBtn} onClick={() => move(1)}><ChevronRight size={16} /></button>
            </div>
            <div style={styles.viewToggle}>
              <button
                style={{ ...styles.viewBtn, ...(axis === "precheck" ? styles.viewBtnActive : {}) }}
                onClick={() => setAxis("precheck")}
              >第1日程 (事前点検/訪問)</button>
              <button
                style={{ ...styles.viewBtn, ...(axis === "honkousei" ? styles.viewBtnActive : {}) }}
                onClick={() => setAxis("honkousei")}
              >第2日程 (本校正/作業)</button>
            </div>
          </div>

          <div style={styles.calGrid}>
            {["日", "月", "火", "水", "木", "金", "土"].map(d => (
              <div key={d} style={styles.calDow}>{d}</div>
            ))}
            {cells.map((date, i) => {
              const iso = date ? toISODate(date) : null;
              const items = iso ? (byDate[iso] || []) : [];
              const isToday = iso === todayIso;
              return (
                <div key={i} style={{ ...styles.calCell, ...(date ? {} : styles.calCellEmpty) }}>
                  {date && (
                    <>
                      <div style={{ ...styles.calDateNum, ...(isToday ? styles.calDateNumToday : {}) }}>
                        {date.getDate()}
                      </div>
                      <div style={styles.calItems}>
                        {items.map(r => {
                          const t = axis === "precheck" ? (r.precheckTime || r.visitTime) : (r.honkouseiTime || r.workTime);
                          return (
                            <div
                              key={r.id}
                              style={{ ...styles.calItem, borderLeftColor: r.tag ? getColor(r.tag, tags.indexOf(r.tag)) : "#5a5548" }}
                              onClick={() => onEdit(r)}
                              title={r.subject}
                            >
                              {t && <span style={styles.calItemTime}>{t} </span>}
                              {r.subject || "（無題）"}
                            </div>
                          );
                        })}
                      </div>
                    </>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );
    }
